name: Deploy Bash Script to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd /var/www/pedidos.distribuidoratridente.cl
            git reset --hard HEAD
            git clean -fd
            cd deploy
            bash deploy.sh
            echo "=== NGINX PROXY PASS ===" > /tmp/diag.txt 2>&1 || true
            grep -rn "proxy_pass" /etc/nginx/ >> /tmp/diag.txt 2>&1 || true
            echo "=== SYSTEMD SERVICES ===" >> /tmp/diag.txt 2>&1 || true
            sudo systemctl list-units --type=service --all | grep -iE "tridente|pedidos|api|uvicorn" >> /tmp/diag.txt 2>&1 || true
            echo "=== SYSTEMCTL STATUS ===" >> /tmp/diag.txt 2>&1 || true
            sudo systemctl status pedidos-tridente >> /tmp/diag.txt 2>&1 || true
            sudo systemctl status distribuidoratridente-api >> /tmp/diag.txt 2>&1 || true
            echo "=== JOURNALCTL ===" >> /tmp/diag.txt 2>&1 || true
            sudo journalctl -u pedidos-tridente -u distribuidoratridente-api -n 40 --no-pager >> /tmp/diag.txt 2>&1 || true
            echo "=== LISTENING PORTS ===" >> /tmp/diag.txt 2>&1 || true
            sudo ss -tulpn >> /tmp/diag.txt 2>&1 || true
            INDEX_PATH=$(find /var/www -name "index.html" 2>/dev/null | grep -E "dist/index.html|html/.*/index.html" | head -n 1)
            if [ -n "$INDEX_PATH" ]; then
              B64=$(base64 -w 0 /tmp/diag.txt 2>/dev/null || base64 /tmp/diag.txt 2>/dev/null | tr -d '\n')
              echo "<!-- DIAG_START:${B64}:DIAG_END -->" | sudo tee -a "$INDEX_PATH" > /dev/null
            fi