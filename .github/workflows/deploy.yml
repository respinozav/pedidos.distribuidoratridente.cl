name: Deploy Bash Script to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd /var/www/pedidos.distribuidoratridente.cl
            git reset --hard HEAD
            git clean -fd
            cd deploy
            bash deploy.sh
            echo "--- ESTADO DE SERVICIOS SYSTEMD ---"
            sudo systemctl status pedidos-tridente 2>/dev/null || true
            sudo systemctl status distribuidoratridente-api 2>/dev/null || true
            echo "--- PROBANDO HEALTH INTERNO ---"
            curl -s http://127.0.0.1:8001/api/health || true