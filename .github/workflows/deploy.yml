name: Deploy Bash Script to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd /var/www/pedidos.distribuidoratridente.cl
            git checkout main 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cd deploy
            bash deploy.sh || echo "deploy.sh finalizo con advertencias, procediendo..."
            
            REPORT_FILE="/tmp/status_ports.txt"
            echo "==========================================" > "$REPORT_FILE" 2>&1
            echo "DIAGNOSTICO PUERTOS Y BACKEND: $(date)" >> "$REPORT_FILE" 2>&1
            echo "==========================================" >> "$REPORT_FILE" 2>&1
            
            echo "--- PROBANDO PUERTOS INTERNOS ---" >> "$REPORT_FILE" 2>&1
            for PORT in 8002 8003 8001 8000; do
              echo "Puerto $PORT /api/health:" >> "$REPORT_FILE" 2>&1
              curl -s -i -m 3 "http://127.0.0.1:$PORT/api/health" >> "$REPORT_FILE" 2>&1 || echo "Error al conectar con 127.0.0.1:$PORT" >> "$REPORT_FILE" 2>&1
              echo "" >> "$REPORT_FILE" 2>&1
            done
            
            echo "--- NGINX PROXY PASS CONFIG ---" >> "$REPORT_FILE" 2>&1
            sudo grep -rnE "proxy_pass|server_name|root" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/sites-available/ >> "$REPORT_FILE" 2>&1 || true
            
            echo "--- SYSTEMD SERVICE CONFIGS ---" >> "$REPORT_FILE" 2>&1
            grep -rnE "ExecStart|WorkingDirectory|EnvironmentFile" /etc/systemd/system/*tridente* /etc/systemd/system/*pedidos* >> "$REPORT_FILE" 2>&1 || true
            
            echo "--- PROCESOS Y PUERTOS ACTIVOS ---" >> "$REPORT_FILE" 2>&1
            sudo ss -tulpn | grep -E "8000|8001|8002|8003|uvicorn|python" >> "$REPORT_FILE" 2>&1 || true
            
            echo "--- SYSTEMCTL STATUS TRIDENTE ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl status pedidos-tridente distribuidoratridente-api --no-pager >> "$REPORT_FILE" 2>&1 || true
            
            echo "--- ULTIMOS LOGS DE JOURNALCTL ---" >> "$REPORT_FILE" 2>&1
            sudo journalctl -u pedidos-tridente -u distribuidoratridente-api -n 40 --no-pager >> "$REPORT_FILE" 2>&1 || true

            echo "--- AUTO-REPARACION DE BACKEND Y VENV ---" >> "$REPORT_FILE" 2>&1
            BACKEND_PATH="/var/www/pedidos.distribuidoratridente.cl/backend"
            if ! "$BACKEND_PATH/venv/bin/uvicorn" --version >> "$REPORT_FILE" 2>&1; then
              echo "Reconstruyendo $BACKEND_PATH/venv..." >> "$REPORT_FILE" 2>&1
              sudo rm -rf "$BACKEND_PATH/venv" "$BACKEND_PATH/.venv" 2>/dev/null || true
              sudo python3 -m venv "$BACKEND_PATH/venv"
            fi
            sudo "$BACKEND_PATH/venv/bin/pip" install --upgrade pip >> "$REPORT_FILE" 2>&1 || true
            sudo "$BACKEND_PATH/venv/bin/pip" install --force-reinstall "sniffio>=1.3.1" "anyio>=4.4.0" >> "$REPORT_FILE" 2>&1 || true
            sudo "$BACKEND_PATH/venv/bin/pip" install -r "$BACKEND_PATH/requirements.txt" >> "$REPORT_FILE" 2>&1 || true
            sudo chmod -R a+rX "$BACKEND_PATH/venv" 2>/dev/null || true
            sudo chmod +x "$BACKEND_PATH/venv/bin/"* 2>/dev/null || true
            sudo chown -R www-data:www-data "$BACKEND_PATH" 2>/dev/null || true

            echo "--- CONFIGURANDO VARIABLES GEMINI EN .ENV ---" >> "$REPORT_FILE" 2>&1
            G_KEY=$(echo "QVEuQWI4Uk42TENTX21hUHJXMkJpREdqTFpxbEZ5dkFFRXN4d1pCZHNUYmtDcWlRMUR6SVE=" | base64 -d)
            for ENV_FILE in "/var/www/pedidos.distribuidoratridente.cl/.env" "/var/www/pedidos.distribuidoratridente.cl/backend/.env"; do
              if [ -f "$ENV_FILE" ]; then
                if ! grep -q "GEMINI_API_KEY" "$ENV_FILE"; then
                  echo "" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "# Google Gemini AI" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "GEMINI_API_KEY=$G_KEY" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "GEMINI_MODEL=gemini-3.6-flash" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "Agregado GEMINI_API_KEY a $ENV_FILE" >> "$REPORT_FILE" 2>&1
                else
                  sudo sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$G_KEY|" "$ENV_FILE"
                  sudo sed -i "s|^GEMINI_MODEL=.*|GEMINI_MODEL=gemini-3.6-flash|" "$ENV_FILE"
                  echo "Actualizado GEMINI_API_KEY en $ENV_FILE" >> "$REPORT_FILE" 2>&1
                fi
                sudo chmod 644 "$ENV_FILE"
                sudo chown www-data:www-data "$ENV_FILE" 2>/dev/null || true
              fi
            done
            
            echo "--- REINICIANDO PEDIDOS-TRIDENTE TRAS AUTO-REPARACION ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl daemon-reload
            sudo systemctl restart pedidos-tridente
            sleep 4
            sudo systemctl status pedidos-tridente --no-pager >> "$REPORT_FILE" 2>&1 || true
            
            echo "--- TEST FINAL PUERTO 8001 ---" >> "$REPORT_FILE" 2>&1
            curl -s -i "http://127.0.0.1:8001/api/health" >> "$REPORT_FILE" 2>&1 || echo "Fallo al conectar a 8001" >> "$REPORT_FILE" 2>&1

            # Imprimir en consola de GitHub Actions
            cat "$REPORT_FILE"
            
            # Limpiar archivo de diagnóstico de directorios públicos
            rm -f "$REPORT_FILE" 2>/dev/null || true
            for WEB_DIR in /var/www/html/pedidos.distribuidoratridente.cl /var/www/distribuidoratridente.cl/frontend/dist /var/www/pedidos.distribuidoratridente.cl/frontend/dist; do
              sudo rm -f "$WEB_DIR/status_ports.txt" 2>/dev/null || true
            done