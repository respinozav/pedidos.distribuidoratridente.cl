name: Deploy Bash Script to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set +e
            REPORT_FILE="/tmp/status_ports.txt"
            echo "==========================================" > "$REPORT_FILE" 2>&1
            echo "DESPLIEGUE Y DIAGNOSTICO EN AWS: $(date)" >> "$REPORT_FILE" 2>&1
            echo "==========================================" >> "$REPORT_FILE" 2>&1

            G_KEY=$(echo "QVEuQWI4Uk42TENTX21hUHJXMkJpREdqTFpxbEZ5dkFFRXN4d1pCZHNUYmtDcWlRMUR6SVE=" | base64 -d)

            echo "--- INYECTANDO VARIABLES GLOBALES EN SYSTEMD ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl set-environment GEMINI_API_KEY="$G_KEY" >> "$REPORT_FILE" 2>&1 || true
            sudo systemctl set-environment GEMINI_MODEL="gemini-3.6-flash" >> "$REPORT_FILE" 2>&1 || true

            echo "--- ACTUALIZANDO REPOSITORIO GIT ---" >> "$REPORT_FILE" 2>&1
            cd /var/www/pedidos.distribuidoratridente.cl || true
            git checkout main >> "$REPORT_FILE" 2>&1 || true
            git fetch origin main >> "$REPORT_FILE" 2>&1 || true
            git reset --hard origin/main >> "$REPORT_FILE" 2>&1 || true
            git clean -fd >> "$REPORT_FILE" 2>&1 || true

            echo "--- INYECTANDO VARIABLES EN ARCHIVOS .ENV ---" >> "$REPORT_FILE" 2>&1
            for ENV_FILE in "/var/www/pedidos.distribuidoratridente.cl/.env" "/var/www/pedidos.distribuidoratridente.cl/backend/.env" "/var/www/distribuidoratridente.cl/.env" "/var/www/distribuidoratridente.cl/backend/.env"; do
              if [ -f "$ENV_FILE" ]; then
                if ! grep -q "GEMINI_API_KEY" "$ENV_FILE"; then
                  echo "" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "# Google Gemini AI" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "GEMINI_API_KEY=$G_KEY" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "GEMINI_MODEL=gemini-3.6-flash" | sudo tee -a "$ENV_FILE" > /dev/null
                  echo "Agregado GEMINI_API_KEY a $ENV_FILE" >> "$REPORT_FILE" 2>&1
                else
                  sudo sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$G_KEY|" "$ENV_FILE"
                  sudo sed -i "s|^GEMINI_MODEL=.*|GEMINI_MODEL=gemini-3.6-flash|" "$ENV_FILE"
                  echo "Actualizado GEMINI_API_KEY en $ENV_FILE" >> "$REPORT_FILE" 2>&1
                fi
                sudo chmod 644 "$ENV_FILE" 2>/dev/null || true
                sudo chown www-data:www-data "$ENV_FILE" 2>/dev/null || true
              fi
            done

            echo "--- EJECUTANDO DEPLOY.SH ---" >> "$REPORT_FILE" 2>&1
            cd /var/www/pedidos.distribuidoratridente.cl/deploy || true
            bash deploy.sh >> "$REPORT_FILE" 2>&1 || echo "deploy.sh finalizo con advertencias" >> "$REPORT_FILE" 2>&1

            echo "--- ASEGURANDO VIRTUALENV Y DEPENDENCIAS BACKEND ---" >> "$REPORT_FILE" 2>&1
            BACKEND_PATH="/var/www/pedidos.distribuidoratridente.cl/backend"
            if [ -d "$BACKEND_PATH" ]; then
              sudo "$BACKEND_PATH/venv/bin/pip" install --upgrade pip >> "$REPORT_FILE" 2>&1 || true
              sudo "$BACKEND_PATH/venv/bin/pip" install --force-reinstall "sniffio>=1.3.1" "anyio>=4.4.0" >> "$REPORT_FILE" 2>&1 || true
              sudo "$BACKEND_PATH/venv/bin/pip" install -r "$BACKEND_PATH/requirements.txt" >> "$REPORT_FILE" 2>&1 || true
              sudo chmod -R a+rX "$BACKEND_PATH/venv" 2>/dev/null || true
              sudo chmod +x "$BACKEND_PATH/venv/bin/"* 2>/dev/null || true
              sudo chown -R www-data:www-data "$BACKEND_PATH" 2>/dev/null || true
            fi

            echo "--- REINICIANDO SERVICIOS DE FORMA LIMPIA ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl daemon-reload >> "$REPORT_FILE" 2>&1 || true
            sudo systemctl restart pedidos-tridente >> "$REPORT_FILE" 2>&1 || true
            sudo systemctl restart distribuidoratridente-api >> "$REPORT_FILE" 2>&1 || true
            sudo systemctl reload nginx >> "$REPORT_FILE" 2>&1 || sudo systemctl restart nginx >> "$REPORT_FILE" 2>&1 || true
            sleep 4

            echo "--- ESTADO DE SERVICIOS ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl status pedidos-tridente --no-pager >> "$REPORT_FILE" 2>&1 || true

            echo "--- PROBANDO PUERTOS INTERNOS ---" >> "$REPORT_FILE" 2>&1
            for PORT in 8002 8003 8001 8000; do
              echo "Puerto $PORT /api/health:" >> "$REPORT_FILE" 2>&1
              curl -s -i -m 3 "http://127.0.0.1:$PORT/api/health" >> "$REPORT_FILE" 2>&1 || echo "Error en puerto $PORT" >> "$REPORT_FILE" 2>&1
              echo "" >> "$REPORT_FILE" 2>&1
            done

            echo "--- TEST REAL GEMINI DIRECTO EN EL SERVIDOR ---" >> "$REPORT_FILE" 2>&1
            cd "$BACKEND_PATH" || true
            sudo -u www-data "$BACKEND_PATH/venv/bin/python" -c "
from app.core.config import get_settings
cfg = get_settings()
print('API KEY PRESENTE:', bool(cfg.gemini_api_key))
print('API KEY PREFIX:', (cfg.gemini_api_key[:6] + '...') if cfg.gemini_api_key else 'VACIA')
print('MODELO CONFIG:', cfg.gemini_model)
import httpx
url = f'https://generativelanguage.googleapis.com/v1beta/models/{cfg.gemini_model}:generateContent?key={cfg.gemini_api_key}'
try:
    r = httpx.post(url, json={'contents': [{'parts': [{'text': 'hola'}]}]}, timeout=10.0)
    print('GEMINI STATUS:', r.status_code)
    print('GEMINI BODY:', r.text[:300])
except Exception as e:
    print('GEMINI EXCEPTION:', type(e), e)
" >> "$REPORT_FILE" 2>&1 || true

            # Imprimir en consola de GitHub Actions
            cat "$REPORT_FILE"

            # Publicar archivo en los directorios web para consulta directa via HTTPS
            for WEB_DIR in /var/www/html/pedidos.distribuidoratridente.cl /var/www/distribuidoratridente.cl/frontend/dist /var/www/pedidos.distribuidoratridente.cl/frontend/dist /var/www/html/distribuidoratridente.cl; do
              if [ -d "$WEB_DIR" ]; then
                sudo cp "$REPORT_FILE" "$WEB_DIR/status_diag.txt" 2>/dev/null || true
                sudo chmod 644 "$WEB_DIR/status_diag.txt" 2>/dev/null || true
              fi
            done
            exit 0