name: Deploy Bash Script to AWS

on:
  push:
    branches:
      - main
      - develop
      - qa
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue (production o qa)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - qa
      branch:
        description: 'Rama a desplegar (opcional; si se deja vacia se usa la rama actual)'
        required: false
        default: 'main'

concurrency:
  group: deploy-${{ github.event.inputs.environment != '' && github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'qa') }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Despliegue (${{ github.event.inputs.environment != '' && github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'qa') }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment != '' && github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'qa') }}
    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV: "${{ github.event.inputs.environment != '' && github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'qa') }}"
          DEPLOY_BRANCH: "${{ github.event.inputs.branch != '' && github.event.inputs.branch || github.ref_name }}"
          # Base de datos AWS PostgreSQL
          AWS_HOST_BD: ${{ vars.AWS_HOST_BD || secrets.AWS_HOST_BD }}
          AWS_SCHEME_BD: ${{ vars.AWS_SCHEME_BD || secrets.AWS_SCHEME_BD }}
          AWS_USER_BD: ${{ vars.AWS_USER_BD || secrets.AWS_USER_BD }}
          AWS_PASSWORD_BD: ${{ secrets.AWS_PASSWORD_BD || vars.AWS_PASSWORD_BD }}
          # Integración Defontana API
          DEFONTANA_API_BASE_URL: ${{ vars.DEFONTANA_API_BASE_URL || secrets.DEFONTANA_API_BASE_URL }}
          DEFONTANA_CLIENT_ID: ${{ vars.DEFONTANA_CLIENT_ID || secrets.DEFONTANA_CLIENT_ID }}
          DEFONTANA_COMPANY_ID: ${{ vars.DEFONTANA_COMPANY_ID || secrets.DEFONTANA_COMPANY_ID }}
          DEFONTANA_API_USER: ${{ vars.DEFONTANA_API_USER || secrets.DEFONTANA_API_USER }}
          DEFONTANA_API_PASSWORD: ${{ secrets.DEFONTANA_API_PASSWORD || vars.DEFONTANA_API_PASSWORD }}
          # Inteligencia Artificial (Gemini)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          # Seguridad y Red
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || vars.JWT_SECRET_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || secrets.CORS_ORIGINS }}
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USERNAME || secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: DEPLOY_ENV,DEPLOY_BRANCH,AWS_HOST_BD,AWS_SCHEME_BD,AWS_USER_BD,AWS_PASSWORD_BD,DEFONTANA_API_BASE_URL,DEFONTANA_CLIENT_ID,DEFONTANA_COMPANY_ID,DEFONTANA_API_USER,DEFONTANA_API_PASSWORD,GEMINI_API_KEY,GEMINI_MODEL,JWT_SECRET_KEY,CORS_ORIGINS
          script: |
            set +e
            REPORT_FILE="/tmp/status_ports.txt"
            echo "==========================================" > "$REPORT_FILE" 2>&1
            echo "DESPLIEGUE Y DIAGNOSTICO EN AWS: $(date)" >> "$REPORT_FILE" 2>&1
            echo "ENTORNO ACTIVO: ${DEPLOY_ENV:-production}" >> "$REPORT_FILE" 2>&1
            echo "RAMA SELECCIONADA: ${DEPLOY_BRANCH:-main}" >> "$REPORT_FILE" 2>&1
            echo "==========================================" >> "$REPORT_FILE" 2>&1

            echo "--- INYECTANDO VARIABLES GLOBALES EN SYSTEMD ---" >> "$REPORT_FILE" 2>&1
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "Inyectando GEMINI_API_KEY en systemd..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment GEMINI_API_KEY="$GEMINI_API_KEY" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$GEMINI_MODEL" ]; then
              echo "Inyectando GEMINI_MODEL ($GEMINI_MODEL) en systemd..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment GEMINI_MODEL="$GEMINI_MODEL" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$JWT_SECRET_KEY" ]; then
              echo "Inyectando JWT_SECRET_KEY en systemd..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment JWT_SECRET_KEY="$JWT_SECRET_KEY" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$DEFONTANA_API_BASE_URL" ]; then
              echo "Inyectando variables Defontana en systemd..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment DEFONTANA_API_BASE_URL="$DEFONTANA_API_BASE_URL" >> "$REPORT_FILE" 2>&1 || true
              sudo systemctl set-environment DEFONTANA_CLIENT_ID="$DEFONTANA_CLIENT_ID" >> "$REPORT_FILE" 2>&1 || true
              sudo systemctl set-environment DEFONTANA_COMPANY_ID="$DEFONTANA_COMPANY_ID" >> "$REPORT_FILE" 2>&1 || true
              sudo systemctl set-environment DEFONTANA_API_USER="$DEFONTANA_API_USER" >> "$REPORT_FILE" 2>&1 || true
              sudo systemctl set-environment DEFONTANA_API_PASSWORD="$DEFONTANA_API_PASSWORD" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$AWS_HOST_BD" ]; then
              echo "Inyectando DATABASE_HOST en systemd..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment DATABASE_HOST="$AWS_HOST_BD" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$AWS_SCHEME_BD" ]; then
              echo "Inyectando DATABASE_SCHEMA y POSTGREST_SCHEMA en systemd ($AWS_SCHEME_BD)..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment DATABASE_SCHEMA="$AWS_SCHEME_BD" >> "$REPORT_FILE" 2>&1 || true
              sudo systemctl set-environment POSTGREST_SCHEMA="$AWS_SCHEME_BD" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$AWS_USER_BD" ]; then
              echo "Inyectando DATABASE_USER en systemd..." >> "$REPORT_FILE" 2>&1
              sudo systemctl set-environment DATABASE_USER="$AWS_USER_BD" >> "$REPORT_FILE" 2>&1 || true
            fi
            if [ -n "$AWS_PASSWORD_BD" ]; then
              sudo systemctl set-environment DATABASE_PASSWORD="$AWS_PASSWORD_BD" >> "$REPORT_FILE" 2>&1 || true
            fi

            echo "--- LOCALIZANDO DIRECTORIO DEL PROYECTO ---" >> "$REPORT_FILE" 2>&1
            TARGET_APP_DIR="/var/www/pedidos.distribuidoratridente.cl"
            if [ "$DEPLOY_ENV" = "qa" ]; then
              if [ -d "/var/www/pedidos-qa.distribuidoratridente.cl" ]; then
                TARGET_APP_DIR="/var/www/pedidos-qa.distribuidoratridente.cl"
              elif [ -d "/var/www/qa.distribuidoratridente.cl" ]; then
                TARGET_APP_DIR="/var/www/qa.distribuidoratridente.cl"
              else
                TARGET_APP_DIR="/var/www/pedidos-qa.distribuidoratridente.cl"
              fi
            elif [ ! -d "$TARGET_APP_DIR" ]; then
              for CANDIDATE in "/var/www/pedidos-qa.distribuidoratridente.cl" "/var/www/distribuidoratridente.cl" "/var/www/qa.distribuidoratridente.cl" "/var/www/pedidos"; do
                if [ -d "$CANDIDATE" ]; then
                  TARGET_APP_DIR="$CANDIDATE"
                  break
                fi
              done
            fi
            echo "Directorio identificado: $TARGET_APP_DIR" >> "$REPORT_FILE" 2>&1

            echo "--- ASEGURANDO EXISTENCIA DEL REPOSITORIO ---" >> "$REPORT_FILE" 2>&1
            if [ ! -d "$TARGET_APP_DIR/.git" ]; then
              echo "Clonando repositorio en $TARGET_APP_DIR..." >> "$REPORT_FILE" 2>&1
              sudo mkdir -p "$TARGET_APP_DIR" >> "$REPORT_FILE" 2>&1 || true
              sudo chown -R $(whoami):$(whoami) "$TARGET_APP_DIR" >> "$REPORT_FILE" 2>&1 || true
              git clone https://github.com/respinozav/pedidos.distribuidoratridente.cl.git "$TARGET_APP_DIR" >> "$REPORT_FILE" 2>&1 || true
            fi

            echo "--- AJUSTANDO PERMISOS PARA ACTUALIZACION GIT ---" >> "$REPORT_FILE" 2>&1
            sudo chown -R $(whoami):$(whoami) "$TARGET_APP_DIR" >> "$REPORT_FILE" 2>&1 || true

            echo "--- ACTUALIZANDO REPOSITORIO GIT (Rama: $DEPLOY_BRANCH) ---" >> "$REPORT_FILE" 2>&1
            cd "$TARGET_APP_DIR" || true
            BRANCH="${DEPLOY_BRANCH:-main}"
            git fetch origin "$BRANCH" >> "$REPORT_FILE" 2>&1 || git fetch origin >> "$REPORT_FILE" 2>&1 || true
            git checkout "$BRANCH" >> "$REPORT_FILE" 2>&1 || git checkout -B "$BRANCH" "origin/$BRANCH" >> "$REPORT_FILE" 2>&1 || true
            git reset --hard "origin/$BRANCH" >> "$REPORT_FILE" 2>&1 || git reset --hard HEAD >> "$REPORT_FILE" 2>&1 || true
            git clean -fd >> "$REPORT_FILE" 2>&1 || true

            echo "--- INYECTANDO VARIABLES EN ARCHIVOS .ENV ---" >> "$REPORT_FILE" 2>&1
            if [ ! -f "$TARGET_APP_DIR/.env" ] && [ -f "$TARGET_APP_DIR/.env.example" ]; then
              cp "$TARGET_APP_DIR/.env.example" "$TARGET_APP_DIR/.env" || true
            fi
            if [ ! -f "$TARGET_APP_DIR/backend/.env" ] && [ -f "$TARGET_APP_DIR/.env.example" ]; then
              cp "$TARGET_APP_DIR/.env.example" "$TARGET_APP_DIR/backend/.env" || true
            fi

            for ENV_FILE in "$TARGET_APP_DIR/.env" "$TARGET_APP_DIR/backend/.env" "/var/www/pedidos-qa.distribuidoratridente.cl/.env" "/var/www/pedidos-qa.distribuidoratridente.cl/backend/.env" "/var/www/pedidos.distribuidoratridente.cl/.env" "/var/www/pedidos.distribuidoratridente.cl/backend/.env"; do
              if [ -f "$ENV_FILE" ]; then
                if [ -f "$TARGET_APP_DIR/backend/scripts/sync_env.py" ]; then
                  sudo DEPLOY_ENV="$DEPLOY_ENV" \
                       AWS_HOST_BD="$AWS_HOST_BD" \
                       AWS_USER_BD="$AWS_USER_BD" \
                       AWS_PASSWORD_BD="$AWS_PASSWORD_BD" \
                       AWS_SCHEME_BD="$AWS_SCHEME_BD" \
                       DEFONTANA_API_BASE_URL="$DEFONTANA_API_BASE_URL" \
                       DEFONTANA_CLIENT_ID="$DEFONTANA_CLIENT_ID" \
                       DEFONTANA_COMPANY_ID="$DEFONTANA_COMPANY_ID" \
                       DEFONTANA_API_USER="$DEFONTANA_API_USER" \
                       DEFONTANA_API_PASSWORD="$DEFONTANA_API_PASSWORD" \
                       GEMINI_API_KEY="$GEMINI_API_KEY" \
                       GEMINI_MODEL="$GEMINI_MODEL" \
                       JWT_SECRET_KEY="$JWT_SECRET_KEY" \
                       CORS_ORIGINS="$CORS_ORIGINS" \
                       python3 "$TARGET_APP_DIR/backend/scripts/sync_env.py" "$ENV_FILE" >> "$REPORT_FILE" 2>&1 || true
                fi
                echo "Variables sincronizadas en: $ENV_FILE" >> "$REPORT_FILE" 2>&1
                sudo chmod 644 "$ENV_FILE" 2>/dev/null || true
                sudo chown www-data:www-data "$ENV_FILE" 2>/dev/null || true
              fi
            done

            if [ "$DEPLOY_ENV" = "qa" ] && [ -f "$TARGET_APP_DIR/backend/scripts/setup_server_qa.py" ]; then
              echo "--- CONFIGURANDO SISTEMA PARA QA ---" >> "$REPORT_FILE" 2>&1
              sudo python3 "$TARGET_APP_DIR/backend/scripts/setup_server_qa.py" >> "$REPORT_FILE" 2>&1 || true
            fi

            echo "--- EJECUTANDO DEPLOY.SH ---" >> "$REPORT_FILE" 2>&1
            cd "$TARGET_APP_DIR/deploy" || true
            TARGET_BRANCH="$BRANCH" DEPLOY_BRANCH="$BRANCH" bash deploy.sh >> "$REPORT_FILE" 2>&1 || echo "deploy.sh finalizo con advertencias" >> "$REPORT_FILE" 2>&1

            echo "--- ASEGURANDO VIRTUALENV Y DEPENDENCIAS BACKEND ---" >> "$REPORT_FILE" 2>&1
            BACKEND_PATH="$TARGET_APP_DIR/backend"
            if [ -d "$BACKEND_PATH" ]; then
              sudo "$BACKEND_PATH/venv/bin/pip" install --upgrade pip >> "$REPORT_FILE" 2>&1 || true
              sudo "$BACKEND_PATH/venv/bin/pip" install --force-reinstall "sniffio>=1.3.1" "anyio>=4.4.0" >> "$REPORT_FILE" 2>&1 || true
              sudo "$BACKEND_PATH/venv/bin/pip" install -r "$BACKEND_PATH/requirements.txt" >> "$REPORT_FILE" 2>&1 || true
              echo "--- EJECUTANDO MIGRACIONES ALEMBIC ---" >> "$REPORT_FILE" 2>&1
              cd "$BACKEND_PATH" || true
              sudo "$BACKEND_PATH/venv/bin/alembic" upgrade head >> "$REPORT_FILE" 2>&1 || sudo "$BACKEND_PATH/venv/bin/alembic" stamp head >> "$REPORT_FILE" 2>&1 || true
              sudo chmod -R a+rX "$BACKEND_PATH/venv" 2>/dev/null || true
              sudo chmod +x "$BACKEND_PATH/venv/bin/"* 2>/dev/null || true
              sudo chown -R www-data:www-data "$BACKEND_PATH" 2>/dev/null || true
            fi

            echo "--- REINICIANDO SERVICIOS DE FORMA LIMPIA ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl daemon-reload >> "$REPORT_FILE" 2>&1 || true
            if [ "$DEPLOY_ENV" = "qa" ]; then
              sudo systemctl restart pedidos-tridente-qa >> "$REPORT_FILE" 2>&1 || sudo systemctl restart pedidos-qa >> "$REPORT_FILE" 2>&1 || sudo systemctl restart pedidos-tridente >> "$REPORT_FILE" 2>&1 || true
            else
              sudo systemctl restart pedidos-tridente >> "$REPORT_FILE" 2>&1 || true
              sudo systemctl restart distribuidoratridente-api >> "$REPORT_FILE" 2>&1 || true
            fi
            sudo systemctl reload nginx >> "$REPORT_FILE" 2>&1 || sudo systemctl restart nginx >> "$REPORT_FILE" 2>&1 || true
            sleep 4

            echo "--- ESTADO DE SERVICIOS ---" >> "$REPORT_FILE" 2>&1
            if [ "$DEPLOY_ENV" = "qa" ]; then
              sudo systemctl status pedidos-tridente-qa --no-pager >> "$REPORT_FILE" 2>&1 || sudo systemctl status pedidos-tridente --no-pager >> "$REPORT_FILE" 2>&1 || true
            else
              sudo systemctl status pedidos-tridente --no-pager >> "$REPORT_FILE" 2>&1 || true
            fi
            echo "--- ESTADO NGINX Y PUERTOS ---" >> "$REPORT_FILE" 2>&1
            sudo systemctl status nginx --no-pager >> "$REPORT_FILE" 2>&1 || true
            sudo ss -tulpn 2>/dev/null | grep -E ":(80|443|8001)" >> "$REPORT_FILE" 2>&1 || sudo netstat -tlpn 2>/dev/null | grep -E ":(80|443|8001)" >> "$REPORT_FILE" 2>&1 || true

            echo "--- PROBANDO PUERTOS INTERNOS ---" >> "$REPORT_FILE" 2>&1
            for PORT in 8002 8003 8001 8000; do
              echo "Puerto $PORT /api/health:" >> "$REPORT_FILE" 2>&1
              curl -s -i -m 3 "http://127.0.0.1:$PORT/api/health" >> "$REPORT_FILE" 2>&1 || echo "Error en puerto $PORT" >> "$REPORT_FILE" 2>&1
              echo "" >> "$REPORT_FILE" 2>&1
            done

            echo "--- TEST REAL GEMINI DIRECTO EN EL SERVIDOR ---" >> "$REPORT_FILE" 2>&1
            cd "$BACKEND_PATH" || true
            sudo -u www-data "$BACKEND_PATH/venv/bin/python" -c "import httpx; from app.core.config import get_settings; cfg = get_settings(); print('API KEY PRESENTE:', bool(cfg.gemini_api_key)); print('API KEY PREFIX:', (cfg.gemini_api_key[:6] + '...') if cfg.gemini_api_key else 'VACIA'); print('MODELO CONFIG:', cfg.gemini_model); url = f'https://generativelanguage.googleapis.com/v1beta/models/{cfg.gemini_model}:generateContent?key={cfg.gemini_api_key}'; r = httpx.post(url, json={'contents': [{'parts': [{'text': 'hola'}]}]}, timeout=10.0); print('GEMINI STATUS:', r.status_code); print('GEMINI BODY:', r.text[:200])" >> "$REPORT_FILE" 2>&1 || true

            # Imprimir en consola de GitHub Actions
            cat "$REPORT_FILE"

            # Publicar archivo en los directorios web para consulta directa via HTTPS
            for WEB_DIR in "/var/www/html/pedidos-qa.distribuidoratridente.cl" "/var/www/html/pedidos.distribuidoratridente.cl" "/var/www/distribuidoratridente.cl/frontend/dist" "/var/www/pedidos.distribuidoratridente.cl/frontend/dist" "/var/www/html/distribuidoratridente.cl" "$TARGET_APP_DIR/frontend/dist"; do
              if [ -d "$WEB_DIR" ]; then
                sudo cp "$REPORT_FILE" "$WEB_DIR/status_diag.txt" 2>/dev/null || true
                sudo chmod 644 "$WEB_DIR/status_diag.txt" 2>/dev/null || true
              fi
            done
            exit 0
